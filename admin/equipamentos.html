<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark - Gestão de Equipamentos</title>
  <link rel="icon" type="image/png" href="../logospark.png">
  <link rel="stylesheet" href="../src/css/style.css">
  <style>
    .admin-header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 0;
    }
    .equipamento-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .equipamento-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .equipamento-nome {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }
    .equipamento-meta {
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .equipamento-preco {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--solar-orange);
    }
    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-painel { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-inversor { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
    .badge-estrutura { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    .badge-servico { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="../dashboard.html" class="brand-logo">
        <img src="../logospark.png" alt="Spark" style="height:38px;">
      </a>
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span id="userEmail" style="font-size: 0.875rem; color: var(--text-muted);"></span>
        <a href="../dashboard.html" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Voltar ao CRM</a>
      </div>
    </div>
  </header>

  <main style="padding: 2.5rem 0;">
    <div class="container">
      
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 1.75rem; font-weight: 700; color: #fff;">Gestão de Equipamentos</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Edite preços de painéis, inversores e serviços. Alterações afetam novos cálculos automaticamente.</p>
      </div>

      <div style="display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap;">
        <button class="filter-btn active" data-tipo="todos">Todos</button>
        <button class="filter-btn" data-tipo="paineis">Painéis</button>
        <button class="filter-btn" data-tipo="inversores">Inversores</button>
        <button class="filter-btn" data-tipo="estruturas">Estruturas</button>
        <button class="filter-btn" data-tipo="kitsEletricos">Kits Elétricos</button>
        <button class="filter-btn" data-tipo="servicos">Serviços</button>
      </div>

      <div id="equipamentosList"></div>

      <div id="editModal" class="modal">
        <div class="modal-content" style="max-width: 450px;">
          <button class="close-modal" id="btnCloseEdit">&times;</button>
          <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; color: #fff;">Editar Equipamento</h3>
          
          <form id="editForm">
            <input type="hidden" id="editId">
            <input type="hidden" id="editTipo">
            
            <div class="form-group">
              <label for="editNome" class="form-label">Nome do Equipamento</label>
              <input type="text" id="editNome" class="form-control" required>
            </div>

            <div class="form-group" id="editPotenciaGroup">
              <label for="editPotencia" class="form-label">Potência (W ou kW)</label>
              <input type="number" id="editPotencia" class="form-control">
            </div>

            <div class="form-group">
              <label for="editPreco" class="form-label">Preço Unitário (R$)</label>
              <input type="number" id="editPreco" class="form-control" step="0.01" min="0" required>
            </div>

            <div class="form-group">
              <label for="editMarca" class="form-label">Marca/Fornecedor</label>
              <input type="text" id="editMarca" class="form-control">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
              <button type="button" class="btn btn-secondary" id="btnCancelEdit">Cancelar</button>
              <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="../src/js/admin/equipamentos.js"></script>
</body>
</html>
