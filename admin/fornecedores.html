<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark - Fornecedores</title>
  <link rel="icon" type="image/png" href="../assets/logospark-f2niuQAy.png">
  <script type="module" crossorigin src="../assets/adminFornecedores-DlG4lszX.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/utils-0vwyr_qt.js">
  <link rel="stylesheet" crossorigin href="../assets/style-CoCL7Yrt.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
      <a href="../dashboard.html" class="brand-logo">
        <img src="../assets/logospark-f2niuQAy.png" alt="Spark" style="height:38px;">
      </a>
      <a href="../dashboard.html" class="btn btn-secondary" style="padding:0.5rem 1rem;font-size:0.875rem;">Voltar ao CRM</a>
    </div>
  </header>

  <main style="padding:2.5rem 0;">
    <div class="container">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;">
        <div>
          <h1 style="font-size:1.75rem;font-weight:700;color:#fff;">📦 Fornecedores</h1>
          <p style="color:var(--text-muted);font-size:0.95rem;">Cadastre distribuidores e compare cotações automaticamente.</p>
        </div>
        <button id="btnNovoFornecedor" class="btn btn-primary" style="padding:0.5rem 1.25rem;">+ Novo Fornecedor</button>
      </div>

      <div id="fornecedoresList" style="display:flex;flex-direction:column;gap:1rem;">
        <div class="glass-card" style="padding:2rem;text-align:center;color:var(--text-muted);">
          Carregando fornecedores...
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Novo/Editar Fornecedor -->
  <div id="fornecedorModal" class="modal">
    <div class="modal-content" style="max-width:550px;">
      <button class="close-modal" id="btnCloseFornecedor">&times;</button>
      <h3 style="font-size:1.25rem;font-weight:700;color:#fff;margin-bottom:1.5rem;" id="fornecedorModalTitle">Novo Fornecedor</h3>
      <form id="fornecedorForm">
        <input type="hidden" id="fornId">
        <div class="form-group"><label class="form-label">Nome do Fornecedor *</label><input type="text" id="fornNome" class="form-control" required></div>
        <div class="form-group"><label class="form-label">CNPJ</label><input type="text" id="fornCnpj" class="form-control"></div>
        <div class="form-group"><label class="form-label">Contato (Nome)</label><input type="text" id="fornContato" class="form-control"></div>
        <div class="form-group"><label class="form-label">Telefone</label><input type="text" id="fornTelefone" class="form-control"></div>
        <div class="form-group"><label class="form-label">Site</label><input type="text" id="fornSite" class="form-control" placeholder="https://..."></div>
        <div class="form-group"><label class="form-label">Observações</label><textarea id="fornObs" class="form-control" rows="2"></textarea></div>
        <div style="display:flex;justify-content:flex-end;gap:0.75rem;margin-top:1rem;">
          <button type="button" class="btn btn-secondary" id="btnCancelFornecedor">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

</body>
</html>
